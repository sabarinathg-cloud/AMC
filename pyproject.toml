[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amc-pipeline"
version = "0.1.0"
description = "Resumable audio PII redaction and ASR training artifact pipeline"
requires-python = ">=3.10.12,<3.11"
dependencies = ["tqdm>=4.66"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
qwen = [
  "qwen-asr==0.0.6",
  "transformers==4.57.6",
  "accelerate==1.12.0",
]

[project.scripts]
amc-pipeline = "amc_pipeline.cli:main"

[tool.setuptools]
packages = ["amc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
